# Weekly dependency update PRs. Each goes through CI (ci.yml) like any other
# change. Minor and patch updates arrive as one grouped PR per ecosystem to
# keep the noise down; major versions get a PR each, since they can break
# things and need a deliberate look (e.g. Next.js 14 → 15).
# Security updates for known vulnerabilities are a separate repository
# setting (Settings → Code security → Dependabot security updates).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
