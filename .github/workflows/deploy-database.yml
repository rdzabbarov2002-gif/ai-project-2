name: Deploy database (staging)

# Applies supabase/migrations to the hosted staging project
# (docs/staging.md). Runs on every push to a branch other than main that
# changes the migrations, and by hand: Actions → this workflow → a run →
# "Re-run all jobs" (or "Run workflow", once this file is on main).
#
# Needs one repository secret, STAGING_SUPABASE_DB_URL: the project's
# Session pooler connection string (Supabase → Connect → Session pooler),
# password included. Without it the run is skipped, not failed. The data
# (plans, tools, templates) comes with the migrations; a run applies only
# migrations the database doesn't have yet.

on:
  push:
    branches-ignore: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/deploy-database.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy-database-staging

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Is staging set up?
        id: secret
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::notice::Skipped: add the repository secret STAGING_SUPABASE_DB_URL (docs/staging.md, step 2), then re-run this workflow."
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply the migrations
        if: steps.secret.outputs.set == 'true'
        run: npx --yes supabase@2.118.0 db push --db-url "$DB_URL"
